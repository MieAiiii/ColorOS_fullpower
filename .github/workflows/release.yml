name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate module metadata
        run: |
          set -e
          grep -q '^id=coloros_fullpower$' src/module.prop
          grep -q '^versionCode=' src/module.prop
          VERSION="$(sed -n 's/^version=//p' src/module.prop)"
          VERSIONCODE="$(sed -n 's/^versionCode=//p' src/module.prop)"
          test -n "$VERSION"
          test "$VERSIONCODE" -ge 600
          test -f src/customize.sh
          test -f src/post-fs-data.sh
          test -f src/service.sh
          test -f src/webroot/index.html
          test -f src/webroot/adapt.sh
          test -f src/files/AntiDizzyBridge.apk
          bash -n src/webroot/adapt.sh
          bash -n src/webroot/ctl.sh
          bash -n src/advanced.sh
          python tools/validate_webui.py
          bash tools/adapt_mock_test.sh

      - name: Build module zip
        run: |
          set -e
          cd src
          ZIP="$GITHUB_WORKSPACE/ColorOS_Features_${GITHUB_REF_NAME}.zip"
          zip -r "$ZIP" . -x '_reference/*' '*.zip'
          unzip -l "$ZIP" | tee "$GITHUB_WORKSPACE/zip-list.txt"
          test "$(unzip -Z1 "$ZIP" | grep -c '^module.prop$')" -eq 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS_Features_${{ github.ref_name }}
          path: ColorOS_Features_*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ColorOS特性补全 ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: ColorOS_Features_*.zip
          generate_release_notes: false
          fail_on_unmatched_files: true
